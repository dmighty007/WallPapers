            margin-bottom: 40px;

            border-bottom-left-radius: 40px; 
            border-bottom-right-radius: 40px;
            overflow: hidden;
            background-color: #000;
        }
        
        .header-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('banner_bg.png');
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            z-index: 0;
            transform: scale(1.05);
            animation: breathe 20s infinite alternate ease-in-out;
        }
        
        @keyframes breathe {
            from { transform: scale(1.05); }
            to { transform: scale(1.15); }
        }
        
        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 { 
            font-weight: 800; 
            letter-spacing: 2px; 
            font-size: 4.5rem;
            background: linear-gradient(to right, #60a5fa, #c084fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideUp 1s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .header p {
            font-weight: 300;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            animation: slideUp 1s cubic-bezier(0.165, 0.84, 0.44, 1) forwards 0.3s;
            opacity: 0;
            transform: translateY(30px);
        }
        
        #gallery {
            column-count: 4;
            column-gap: 1.5rem;
        }
        @media (max-width: 1400px) { #gallery { column-count: 3; } }
        @media (max-width: 900px) { #gallery { column-count: 2; } }
        @media (max-width: 576px) { #gallery { column-count: 1; } }
        
        .gallery-box {
            display: inline-block;
            width: 100%;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            break-inside: avoid;
            page-break-inside: avoid;
        }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(30px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        .gallery-item { 
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-radius: 20px; 
            overflow: hidden; 
            cursor: pointer; 
            background: linear-gradient(120deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: skeletonLoading 2s infinite linear;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            min-height: 200px;
        }
        
        @keyframes skeletonLoading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .gallery-item:hover { 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.7); 
            z-index: 10;
        }
        .gallery-item img { 
            width: 100%; 
            height: auto; 
            display: block;

        }
        .gallery-item:hover img {

            transform: scale(1.05);
        }

            transition: all 0.3s ease;

            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 1.2rem;

            padding: 40px;
            color: #8b5cf6;
            margin-bottom: 40px;
        }

            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #60a5fa, #8b5cf6);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);

            align-items: center;
            justify-content: center;
            font-size: 1.5rem;

        }

            transform: scale(1.1) translateY(-5px);

<div class="header text-white">

<div class="container-fluid px-4 px-md-5 mb-5">

    <div class="search-container">
        <i class="bi bi-search search-icon"></i>
        <input type="text" class="search-input" id="searchInput" placeholder="Search wallpapers by title or keywords...">
    </div>

    <!-- Filters -->
    <div class="d-flex flex-wrap justify-content-center mb-5" id="filter-container">
        <button class="filter-btn active" data-filter="all">All Wallpapers</button>
        <button class="filter-btn" data-filter="Abstract_Art">Abstract Art</button>
        <button class="filter-btn" data-filter="Animals">Animals</button>
        <button class="filter-btn" data-filter="Characters_People">Characters People</button>
        <button class="filter-btn" data-filter="City_Architecture">City Architecture</button>
        <button class="filter-btn" data-filter="Misc">Misc</button>
        <button class="filter-btn" data-filter="Nature_Landscapes">Nature Landscapes</button>
        <button class="filter-btn" data-filter="Space_SciFi">Space SciFi</button>
        <button class="filter-btn" data-filter="Vehicles">Vehicles</button>

    </div>

    <!-- Smart CSS Grid with infinite scrolling -->
    <div id="gallery"></div>
    
    <!-- Sentinel for IntersectionObserver to load more items -->
    <div id="loading-sentinel">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-2 d-flex justify-content-between align-items-center">
        <h5 class="modal-title font-monospace text-white fw-light mb-0" id="modalTitle"></h5>
        <div>
          <a href="#" id="modalDownloadBtn" class="btn btn-outline-light btn-sm rounded-pill me-3 px-3 py-1" download>
            <i class="bi bi-download me-1"></i> Download
          </a>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
      </div>
      <div class="modal-body text-center p-0 mt-2">
        <img src="" id="modalImage" class="img-fluid shadow-lg" alt="Wallpaper">
      </div>
    </div>
  </div>
</div>

<!-- Scroll to Top FAB -->
<button id="fab-top" aria-label="Scroll to top">
    <i class="bi bi-arrow-up-short"></i>
</button>

    const searchInput = document.getElementById('searchInput');

    function renderBatch() {
        const batch = filteredData.slice(currentIndex, currentIndex + BATCH_SIZE);
        if (batch.length === 0) {
            sentinel.style.display = 'none';
            return;
        }
        
        sentinel.style.display = 'block';

            const div = document.createElement('div');
            div.className = `gallery-box ${item.category}`;

                </div>

            galleryContainer.appendChild(div);
        });
        
        currentIndex += BATCH_SIZE;
        
        if (currentIndex >= filteredData.length) {
            sentinel.style.display = 'none';
        }
    }

    function resetAndRender() {
        galleryContainer.innerHTML = '';
        currentIndex = 0;
        renderBatch();

            sentinel.innerHTML = '<div class="text-muted"><i class="bi bi-search me-2"></i>No wallpapers found matching your search.</div>';
        } else {
            sentinel.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>';
        }
    });

    // Initial Filter setup
    filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            filterBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            currentFilter = btn.getAttribute('data-filter');
            
            // Apply both filter and current search query
            const query = searchInput.value.toLowerCase().trim();
            const baseData = currentFilter === 'all' 
                ? galleryData 
                : galleryData.filter(item => item.category === currentFilter);
                
            if (query === '') {
                filteredData = baseData;
            } else {
                filteredData = baseData.filter(item => item.title.toLowerCase().includes(query) || item.category.toLowerCase().includes(query));
            }
            
            sentinel.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>';
            resetAndRender();
        });
    });
    
    // FAB Visibility and Scroll
    window.addEventListener('scroll', () => {
        if (window.scrollY > 500) {
            fabTop.classList.add('visible');
        } else {
            fabTop.classList.remove('visible');
        }
    });
    
    fabTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Setup Intersection Observer for infinite scrolling
    const scrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                renderBatch();
            }
        });
    }, { rootMargin: "0px 0px 800px 0px" }); // aggressively load next batch before user reaches bottom
    
    scrollObserver.observe(sentinel);

    // Modal Events
    const imageModal = document.getElementById('imageModal');
    imageModal.addEventListener('show.bs.modal', event => {
        const trigger = event.relatedTarget; // Button that triggered the modal
        // If trigger is null, it might be due to event delegation issues, but Bootstrap handles this well.
        if (trigger) {
            const imgSrc = trigger.getAttribute('data-img');
            const title = trigger.getAttribute('data-title');
            
            document.getElementById('modalImage').src = imgSrc;
            document.getElementById('modalTitle').textContent = title;
            
            const downloadBtn = document.getElementById('modalDownloadBtn');
            downloadBtn.href = imgSrc;
            downloadBtn.download = imgSrc.split('/').pop();
        }
    });
</script>
</body>
</html>
